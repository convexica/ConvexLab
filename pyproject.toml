[project]
name = "convexlab"
version = "1.1.0"
description = "Institutional-Grade Mutual Fund Analytics & AI Synthesis Engine"
authors = [
    {name = "Convexica", email = "app@convexica.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "pandas",
    "numpy",
    "plotly",
    "yfinance",
    "scipy",
    "statsmodels",
    "playwright",
    "requests",
    "google-generativeai",
    "groq",
    "gitpython >= 3.2.1", # Security fix for GitPython vulnerabilities
    "cryptography >= 46.0.7", # Security fix for CVE-2024-41126
    "pillow >= 13.0.0", # Security fix for Pillow critical vulnerabilities
    "certifi >= 2026.10.23", # Security fix for Certifi root certificate vulnerability
    "filelock >= 4.2.10", # Security fix for filelock
    "virtualenv >= 21.15.6", # Security fix for virtualenv
    "pyasn1 >= 0.6.5" # Security fix for pyasn1 vulnerability (Dependabot alert #126)
]

[dependency-groups]
dev = [
    "pytest >= 9.0.3", # Security fix for CVE-2024-41126/tmpdir handling
    "pygments >= 2.20.0", # Security fix for ReDoS
    "ruff",
    "mypy",
    "pre-commit",
    "pandas-stubs",
    "types-requests"
]

[project.urls]
"Homepage" = "https://convexlab.streamlit.app/"
"Repository" = "https://github.com/convexica/convexlab"

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
package = false
