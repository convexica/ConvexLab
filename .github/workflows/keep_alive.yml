name: Professional App Keep-Alive

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:       # Allows manual triggering

permissions:
  contents: read

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Playwright & Run Wake-up
        run: |
          uv run playwright install chromium
          uv run python scripts/wake_app.py
