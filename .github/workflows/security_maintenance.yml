name: Security & Dependency Maintenance

on:
  schedule:
    # Run every Sunday night at 02:00 UTC (07:30 IST) before market week starts
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    name: Audit & Upgrade Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Upgrade Lockfile & Run Audit
        run: |
          uv lock --upgrade
          uv run --with pip-audit pip-audit

      - name: Run Test Suite
        run: |
          uv run pytest tests/
          uv run ruff check .
          uv run mypy app/

      - name: Commit and Push Direct to Main
        run: |
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git config --global user.name "ConvexLab-Bot"
            git config --global user.email "bot@convexica.com"
            git add uv.lock
            git commit -m "chore(security): weekly automated lockfile upgrade & vulnerability audit [skip ci]"
            git push origin main
          else
            echo "Lockfile is already up to date with zero changes."
          fi
